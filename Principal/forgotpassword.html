<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Principal - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body class="min-h-screen bg-white font-sans text-[#292929]">
    <header
      class="h-20 flex items-center justify-between px-6 bg-white border-b border-gray-300 shadow-lg lg:px-10"
    >
      <img
        src="./images/principal logo.png"
        alt="Principal"
        class="w-44 h-30"
      />
      <button
        class="h-14 min-w-[150px] rounded-full bg-[#087cc1] px-8 flex items-center justify-center text-white text-[20px] font-bold hover:bg-blue-600"
      >
        Log in
      </button>
    </header>

    <main class="flex-1">
      <section class="w-full max-w-md mx-auto px-6 pt-20 pb-24">
        <h1 class="text-[45px] font-light leading-[1.2] text-black">
          Verify your identity
        </h1>

        <form class="mt-[45px]">
          <!-- First Name -->
          <div>
            <label
              for="firstName"
              class="mb-2 block text-[20px] font-normal text-[#555]"
            >
              First name <span class="text-[#9b3f3f]">*</span>
            </label>
            <input
              id="firstName"
              type="text"
              class="h-14 w-full rounded-md border border-black bg-white px-4 text-[20px] text-[#444] outline-none focus:border-[#2f79bd] focus:ring-1 focus:ring-[#2f79bd]"
            />
          </div>

          <!-- Last Name -->
          <div class="mt-[34px]">
            <label
              for="lastName"
              class="mb-2 block text-[20px] font-normal text-[#555]"
            >
              Last name <span class="text-[#9b3f3f]">*</span>
            </label>
            <input
              id="lastName"
              type="text"
              class="h-14 w-full rounded-md border border-black bg-white px-4 text-[20px] text-[#444] outline-none focus:border-[#2f79bd] focus:ring-1 focus:ring-[#2f79bd]"
            />
          </div>

          <!-- Account Type -->
          <div class="mt-[34px]">
            <p class="mb-4 text-[20px] font-normal text-[#555]">
              Select one of the following <span class="text-[#9b3f3f]">*</span>
            </p>

            <label
              class="flex cursor-pointer items-start gap-3 text-[20px] leading-[1.5] text-[#555]"
            >
              <input
                type="radio"
                name="accountType"
                value="retirement"
                checked
                class="mt-1 h-5 w-5 shrink-0 accent-[#347bb9]"
              />
              <span
                >I have a retirement account or insurance<br
                  class="hidden sm:block"
                />
                policy with Principal.</span
              >
            </label>

            <label
              class="mt-4 flex cursor-pointer items-start gap-3 text-[20px] leading-[1.5] text-[#555]"
            >
              <input
                type="radio"
                name="accountType"
                value="business"
                class="mt-1 h-5 w-5 shrink-0 accent-[#347bb9]"
              />
              <span>I do business with Principal.</span>
            </label>
          </div>

          <!-- Email -->
          <div class="mt-[35px]">
            <label
              for="email"
              class="mb-2 block text-[20px] font-normal text-[#555]"
            >
              Email address <span class="text-[#9b3f3f]">*</span>
            </label>
            <input
              id="email"
              type="email"
              class="h-14 w-full rounded-md border border-black bg-white px-4 text-[20px] text-[#444] outline-none focus:border-[#2f79bd] focus:ring-1 focus:ring-[#2f79bd]"
            />
          </div>

          <!-- Phone Number -->
          <div class="mt-[34px]">
            <label
              for="phone"
              class="mb-1 block text-[20px] font-normal text-[#555]"
            >
              Phone number <span class="text-[#9b3f3f]">*</span>
            </label>

            <p class="mb-2 text-[20px] text-[#777]">
              Valid format is (XXX) XXX-XXXX
            </p>

            <div
              class="flex h-14 w-full items-center rounded-md border border-black    bg-white"
            >
              <button
                type="button"
                class="flex h-full items-center gap-2 border-r-0 px-3 text-[20px] text-[#555]"
              >
                <span class="text-[20px]">🇺🇸</span>
                <span class="text-[11px]">▼</span>
              </button>

              <input
                id="phone"
                type="tel"
                placeholder="(201) 555-0123"
                class="h-full flex-1 bg-transparent px-2 text-[20px] text-[#444] outline-none placeholder:text-[#777]"
              />
            </div>
          </div>

          <!-- Buttons -->
          <div class="mt-[42px] flex flex-col items-center">
            <button
              type="submit"
              class="h-14 min-w-[155px] rounded-full bg-[#087cc1] px-8 text-[20px] font-semibold text-white transition hover:bg-[#066ca8]"
            >
              Continue
            </button>

            <button
              type="button"
              class="mt-8 border-b border-dotted border-[#4f718c] pb-1 text-[20px] text-[#4f718c] hover:text-[#087cc1]"
            >
              Cancel
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="bg-[#303030] text-white px-4 py-12 lg:px-10 lg:py-20">
      <div class="mb-10 lg:mb-16">
        <p class="text-xl">
          Trouble logging in?
          <a href="#" class="font-bold underline underline-offset-4"
            >Get help</a
          >
        </p>
      </div>

      <nav
        class="flex flex-col gap-7 text-xl mb-12 lg:flex-row lg:items-center lg:gap-10 lg:mb-7"
      >
        <a href="#" class="hover:underline">Terms of use</a>
        <a href="#" class="hover:underline">Disclosures</a>
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Security</a>
        <a href="#" class="hover:underline">Report fraud</a>
      </nav>

      <div
        class="border-t border-white pt-8 pb-6 lg:flex lg:items-end lg:justify-between"
      >
        <div>
          <p class="text-lg mb-5">©2026 Principal Financial Services, Inc.</p>

          <p class="text-lg leading-relaxed">
            Securities offered through Principal Securities, Inc.,
            <span class="font-semibold underline underline-offset-4"
              >member SIPC</span
            >
          </p>
        </div>

        <div class="flex items-center gap-8 mt-10 lg:mt-0 lg:mb-10">
          <a href="#" aria-label="Facebook" class="hover:opacity-80">
            <i class="fa-brands fa-facebook text-[34px]"></i>
          </a>

          <a href="#" aria-label="X" class="hover:opacity-80">
            <i class="fa-brands fa-x-twitter text-[34px]"></i>
          </a>

          <a href="#" aria-label="YouTube" class="hover:opacity-80">
            <i class="fa-brands fa-youtube text-[34px]"></i>
          </a>

          <a href="#" aria-label="LinkedIn" class="hover:opacity-80">
            <i class="fa-brands fa-linkedin text-[34px]"></i>
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
